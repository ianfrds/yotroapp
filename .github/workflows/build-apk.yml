name: Build Yotro Safe Release

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build signed APK and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK Platform 37 & licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "platforms;android-35" "platforms;android-34" "cmake;3.22.1" || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            sudo ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Restore release signing key
        env:
          YOTRO_KEYSTORE_BASE64: ${{ secrets.YOTRO_KEYSTORE_BASE64 }}
          YOTRO_STORE_PASSWORD: ${{ secrets.YOTRO_STORE_PASSWORD }}
          YOTRO_KEY_PASSWORD: ${{ secrets.YOTRO_KEY_PASSWORD }}
          YOTRO_KEY_ALIAS: ${{ secrets.YOTRO_KEY_ALIAS }}
        run: |
          if [ -n "$YOTRO_KEYSTORE_BASE64" ]; then
            echo "Restoring production release keystore from GitHub Secrets..."
            echo "$YOTRO_KEYSTORE_BASE64" | base64 --decode > android/yotro-release-key.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../yotro-release-key.jks\n' \
              "$YOTRO_STORE_PASSWORD" "$YOTRO_KEY_PASSWORD" "$YOTRO_KEY_ALIAS" \
              > android/key.properties
          else
            echo "Notice: YOTRO_KEYSTORE_BASE64 is not configured in GitHub Secrets."
            echo "Generating self-signed CI release keystore to allow build to succeed..."
            keytool -genkeypair -v -keystore android/yotro-release-key.jks \
              -storepass yotroci123 -alias yotro -keypass yotroci123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Yotro CI, OU=Mobile, O=Yotro, L=Jakarta, ST=Jakarta, C=ID"
            printf 'storePassword=yotroci123\nkeyPassword=yotroci123\nkeyAlias=yotro\nstoreFile=../yotro-release-key.jks\n' \
              > android/key.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build safe release APK
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build web release
        run: flutter build web --release --no-tree-shake-icons

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yotro-safe-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/web/**
          if-no-files-found: error
          retention-days: 14
