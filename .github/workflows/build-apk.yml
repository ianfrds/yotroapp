name: Build Yotro Safe Release

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build signed APK and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          YOTRO_KEYSTORE_BASE64: ${{ secrets.YOTRO_KEYSTORE_BASE64 }}
          YOTRO_STORE_PASSWORD: ${{ secrets.YOTRO_STORE_PASSWORD }}
          YOTRO_KEY_PASSWORD: ${{ secrets.YOTRO_KEY_PASSWORD }}
          YOTRO_KEY_ALIAS: ${{ secrets.YOTRO_KEY_ALIAS }}
        run: |
          test -n "$YOTRO_KEYSTORE_BASE64" || (echo "Missing YOTRO_KEYSTORE_BASE64" && exit 1)
          echo "$YOTRO_KEYSTORE_BASE64" | base64 --decode > android/yotro-release-key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../yotro-release-key.jks\n' \
            "$YOTRO_STORE_PASSWORD" "$YOTRO_KEY_PASSWORD" "$YOTRO_KEY_ALIAS" \
            > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build safe release APK
        run: flutter build apk --release

      - name: Build web release
        run: flutter build web --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yotro-safe-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/**
          if-no-files-found: error
          retention-days: 14
