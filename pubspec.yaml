name: money_tracker
description: A minimalist dark mode Money Tracker app built with Flutter and Forui.
publish_to: 'none'
version: 2.0.4+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  flutter_tabler_icons: ^1.43.0
  permission_handler: 11.3.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_svg: ^2.3.2
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.0
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.3
  package_info_plus: ^10.2.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
